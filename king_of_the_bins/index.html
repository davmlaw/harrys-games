<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>King of the Bins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap">
<link rel="stylesheet" href="style.css?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
</head>
<body>
<div id="app">
  <header>
    <a href="../index.html" class="back">← Harry's Games</a>
    <h1>King of the Bins</h1>
    <button id="mute" title="Sound on/off (M)">🔊</button>
  </header>

  <div id="stage">
    <canvas id="cv" width="960" height="540"></canvas>

    <div id="titleUI" class="ui">
      <button id="playBtn" class="big">PLAY!</button>
    </div>

    <div id="endUI" class="ui" hidden>
      <div class="card">
        <h2>BUSTED!</h2>
        <div id="endStats"></div>
        <button id="againBtn" class="big">PLAY AGAIN</button>
      </div>
    </div>

    <div id="mbar">
      <a href="../index.html">← Games</a>
      <button id="fsBtn">Full screen</button>
    </div>

    <div id="touch" aria-hidden="true">
      <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
      <div class="btns">
        <button data-k="act" class="act">🔍<small>RUMMAGE</small></button>
        <button data-k="jump" class="jump">⤒<small>JUMP</small></button>
      </div>
    </div>
  </div>

  <div id="rotate">
    <div class="phone">📱</div>
    <p>Turn your phone sideways to play!</p>
    <button id="rotateFs" class="big">Full screen</button>
    <button id="anyway" class="anyway">Play this way anyway</button>
  </div>

  <div id="help">
    <span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> move</span>
    <span><kbd>Space</kbd> jump</span>
    <span><kbd>X</kbd> rummage</span>
    <span>Line up with bins to knock them over · Dodge up and down · Jump on humans' heads · Don't get caged!</span>
  </div>
</div>
<script src="game.js?v=4"></script>
</body>
</html>
